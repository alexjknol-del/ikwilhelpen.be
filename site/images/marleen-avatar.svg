    <path d="M100 34 C130 34 148 56 147 84 C147 92 144 98 140 100 C140 78 130 62 116 56 C118 66 112 72 104 70 C96 68 94 60 96 52 C82 54 70 66 66 82 C63 96 60 96 58 84 C52 54 72 34 100 34 Z" fill="#7a5232"/>
